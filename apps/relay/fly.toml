app = 'groovy-relay'
primary_region = 'sjc'

[build]

[env]
  AGENT_TASK_COMPLETION_ORIGIN = "https://www.gogroovy.ai"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
